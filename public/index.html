<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApplyTrack</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><header><h1>ApplyTrack</h1><p>Your next opportunity, organized.</p></header><main><div id="stats" class="stats"></div><div id="message" role="alert" aria-live="polite"></div><div class="grid"><aside><section class="panel"><h2>Add application</h2><form id="create"><label>Company<input name="company" type="text" required maxlength="120"></label><label>Role<input name="role" type="text" required maxlength="120"></label><label>Notes<textarea name="notes" maxlength="2000" rows="3"></textarea></label><button>Add application</button></form></section></aside><div><section class="panel"><h2>Applications</h2><div class="toolbar"><input id="search" aria-label="Search" placeholder="Search..."><select id="filter" aria-label="Filter by status"><option value="">All statuses</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option></select><button id="export" class="secondary">Export CSV</button></div><div id="list"></div></section></div></div></main><footer>Local portfolio demo · JavaScript / Node.js / SQLite</footer></body></html>
