<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockDesk</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><header><h1>StockDesk</h1><p>Know your stock. Track every change.</p></header><main><div id="stats" class="stats"></div><div id="message" role="alert" aria-live="polite"></div><div class="grid"><aside><section class="panel"><h2>Add product</h2><form id="create"><label>Product name<input name="name" type="text" required maxlength="120"></label><label>Unique SKU<input name="sku" type="text" required maxlength="40"></label><label>Low-stock threshold<input name="threshold" type="number" required min="0" max="10000000" value="5"></label><button>Add product</button></form></section><section class="panel"><h2>Stock adjustment</h2><form id="movement"><label>Product<select name="product_id" id="product" required></select></label><label>Change (+ received / - issued)<input name="delta" type="number" required min="-1000000" max="1000000"></label><label>Reason<input name="reason" type="text" required maxlength="200"></label><button>Record movement</button></form></section></aside><div><section class="panel"><h2>Inventory</h2><div class="toolbar"><input id="search" aria-label="Search" placeholder="Search..."><button id="export" class="secondary">Export CSV</button></div><div id="list"></div></section><section class="panel"><h2>Recent stock movements</h2><div id="history"></div></section></div></div></main><footer>Local portfolio demo · JavaScript / Node.js / SQLite</footer></body></html>
